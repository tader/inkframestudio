name: Add-on images

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: inkframestudio
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    name: Image metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      image_prefix: ${{ steps.version.outputs.image_prefix }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "release" ]; then
            release_tag="${{ github.event.release.tag_name }}"
          fi
          version="${release_tag#v}"
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "release_tag=${release_tag}"
            echo "version=${version}"
            echo "image_prefix=${{ env.REGISTRY }}/${owner}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
          - arch: armhf
            platform: linux/arm/v6
          - arch: i386
            platform: linux/386
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
          tags: |
            ${{ needs.metadata.outputs.image_prefix }}/${{ matrix.arch }}-${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.version }}
            ${{ needs.metadata.outputs.image_prefix }}/${{ matrix.arch }}-${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.release_tag }}
            ${{ needs.metadata.outputs.image_prefix }}/${{ matrix.arch }}-${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ env.IMAGE_NAME }}
          cache-to: type=gha,scope=${{ matrix.arch }}-${{ env.IMAGE_NAME }},mode=max

  manifest:
    name: Publish multi-arch manifest
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifests
        shell: bash
        env:
          IMAGE_PREFIX: ${{ needs.metadata.outputs.image_prefix }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          images=(
            "${IMAGE_PREFIX}/amd64-${IMAGE_NAME}"
            "${IMAGE_PREFIX}/aarch64-${IMAGE_NAME}"
            "${IMAGE_PREFIX}/armv7-${IMAGE_NAME}"
            "${IMAGE_PREFIX}/armhf-${IMAGE_NAME}"
            "${IMAGE_PREFIX}/i386-${IMAGE_NAME}"
          )
          for tag in "${VERSION}" "${RELEASE_TAG}" latest; do
            sources=()
            for image in "${images[@]}"; do
              sources+=("${image}:${tag}")
            done
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}/${IMAGE_NAME}:${tag}" \
              "${sources[@]}"
          done
